<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeuroTutor · Alemán A1</title>
<style>
:root{
  --ink:#1E1C3B; --muted:#5E5C7A; --paper:#F4F3FB; --card:#FFFFFF; --line:#E3E1F2;
  --violet:#5B47E0; --violet-2:#8A7BF0; --sun:#FFB627; --sun-bg:#FFF5DD; --mint:#0F9D78; --mint-bg:#E3F7F0;
  --coral:#E0465F; --coral-bg:#FDEBEE; --face:#FBFAFF; --blank:#F0EEFC;
  --shadow:0 1px 2px rgba(30,28,59,.06), 0 14px 34px -12px rgba(60,40,160,.28);
  --r-card:26px; --r-ctl:14px;
  --ui:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#ECEAFB; --muted:#A9A6C6; --paper:#14132A; --card:#1E1C3A; --line:#34315A; --face:#262449; --blank:#2C2954;
  --violet:#8C7CFF; --violet-2:#B3A8FF; --sun-bg:#3A3018; --mint:#3DD3A6; --mint-bg:#16352E; --coral:#FF7A8F; --coral-bg:#3D1E28;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 40px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ink:#ECEAFB; --muted:#A9A6C6; --paper:#14132A; --card:#1E1C3A; --line:#34315A; --face:#262449; --blank:#2C2954;
  --violet:#8C7CFF; --violet-2:#B3A8FF; --sun-bg:#3A3018; --mint:#3DD3A6; --mint-bg:#16352E; --coral:#FF7A8F; --coral-bg:#3D1E28;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:var(--ui);color:var(--ink);background:var(--paper);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(60rem 30rem at 110% -10%, color-mix(in srgb,var(--violet) 22%,transparent), transparent 60%),
                   radial-gradient(40rem 26rem at -20% 110%, color-mix(in srgb,var(--sun) 20%,transparent), transparent 60%);
  background-attachment:fixed}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  background:color-mix(in srgb,var(--paper) 78%,transparent);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;letter-spacing:-.01em;font-size:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,var(--violet),var(--violet-2),var(--sun),var(--violet));box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 16%,transparent)}
.logo{width:34px;height:34px;flex:none;overflow:visible;filter:drop-shadow(0 3px 6px color-mix(in srgb,var(--violet) 35%,transparent))}
.logo .lobes{transform-origin:32px 32px;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.logo .nodes circle{animation:fire 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.logo .nodes circle:nth-child(2){animation-delay:.53s}.logo .nodes circle:nth-child(3){animation-delay:1.07s}
.logo .nodes circle:nth-child(4){animation-delay:1.6s}.logo .nodes circle:nth-child(5){animation-delay:2.13s}.logo .nodes circle:nth-child(6){animation-delay:2.67s}
@keyframes fire{0%,12%,100%{fill:#fff;transform:scale(1)}5%{fill:var(--sun);transform:scale(1.5)}}
.logo.cheer{animation:cheer .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes cheer{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:none}}
.logo.big{width:84px;height:84px;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){.logo .spark{display:none}}
#progress{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
#bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--violet-2));transition:width .5s cubic-bezier(.2,.8,.2,1)}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:64px;text-align:right}
main{max-width:720px;margin:0 auto;padding:22px 16px 48px}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:26px 22px 18px;border:1px solid var(--line);animation:enter .35s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@media (min-width:640px){.card{padding:34px 36px 22px}}
.consigna{margin:0 0 18px;font-size:16px;color:var(--muted);font-weight:600}
.visual{display:flex;justify-content:center;margin:4px 0 22px}
.visual svg{width:100%;max-width:340px;height:auto;color:var(--ink)}
.visual svg.small{max-width:230px}
.scene{border-radius:20px;overflow:hidden}
.clockwrap{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.clockwrap .clock{width:210px;max-width:62vw}
.digital{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;padding:10px 20px;border-radius:18px;background:var(--blank);color:var(--ink);border:2px solid var(--line)}
.stim{font-size:clamp(21px,5.4vw,27px);font-weight:700;line-height:1.9;letter-spacing:-.005em;margin:0 0 6px}
.stim.src{background:var(--blank);border-radius:18px;padding:14px 18px;line-height:1.4;margin-bottom:16px}
.blank,.answer{font:inherit;color:var(--ink);background:var(--blank);border:2px solid transparent;border-bottom:3px solid var(--violet);border-radius:12px;padding:2px 10px;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
.blank{width:7ch;max-width:100%;text-align:center;font-weight:700}
.answer{width:100%;font-size:20px;font-weight:600;padding:14px 16px}
.blank:focus,.answer:focus{border-color:var(--violet);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 20%,transparent);background:var(--card)}
.blank.ok{border-color:var(--mint);background:var(--mint-bg)}
.blank.bad{border-color:var(--coral);background:var(--coral-bg)}
.blank[readonly],.answer[readonly]{opacity:.85}
.tiles .build{min-height:64px;border:2px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;transition:border-color .2s}
.tiles .build.has{border-color:var(--violet-2)}
.tiles .pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;min-height:52px}
.tile{font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 16px;cursor:pointer;min-height:48px;transition:transform .15s,border-color .15s}
.tile:active{transform:translateY(2px)}
.build .tile{background:var(--blank);border-color:var(--violet-2)}
.feedback{margin-top:20px}
.feedback>div{border-radius:18px;padding:14px 16px;animation:enter .3s cubic-bezier(.2,.8,.2,1)}
.feedback p{margin:4px 0}
.feedback .tag{font-weight:800;margin:0 0 2px}
.feedback .de{font-size:20px;font-weight:700}
.feedback .sub{font-size:14px;color:var(--muted)}
.hint{display:flex;gap:14px;align-items:flex-start;background:var(--sun-bg);border:1px solid color-mix(in srgb,var(--sun) 55%,transparent)}
.bulbs{display:flex;gap:5px;padding-top:6px}
.bulbs i{width:12px;height:12px;border-radius:50%;border:2px solid var(--sun);display:block}
.bulbs i.on{background:var(--sun);box-shadow:0 0 10px var(--sun)}
.good{background:var(--mint-bg);border:1px solid color-mix(in srgb,var(--mint) 45%,transparent)}
.good .tag{color:var(--mint)}
.solution{background:var(--coral-bg);border:1px solid color-mix(in srgb,var(--coral) 40%,transparent)}
.solution .tag{color:var(--coral)}
.note{background:var(--blank);color:var(--muted)}
s{opacity:.7}
.actions{display:flex;justify-content:flex-end;margin-top:20px}
button.primary{font:inherit;font-weight:800;font-size:18px;color:#fff;border:0;border-radius:var(--r-ctl);padding:14px 28px;min-height:52px;cursor:pointer;
  background:linear-gradient(135deg,var(--violet),color-mix(in srgb,var(--violet) 70%,#C04BD8));box-shadow:0 10px 22px -10px var(--violet);transition:transform .12s,filter .2s}
button.primary:hover{filter:brightness(1.07)}
button.primary:active{transform:translateY(1px) scale(.99)}
button.primary.next{background:linear-gradient(135deg,var(--mint),color-mix(in srgb,var(--mint) 70%,#2C7BE5))}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
@media (max-width:520px){.actions button.primary{width:100%}}
.kbd{margin:12px 0 0;text-align:right;font-size:13px;color:var(--muted)}
@media (pointer:coarse){.kbd{display:none}}
kbd{font:inherit;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--face)}
.intro h1{font-size:clamp(30px,7vw,40px);line-height:1.1;letter-spacing:-.02em;margin:8px 0 10px}
.intro .lead{font-size:19px;color:var(--muted);margin:0 0 18px}
.how{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.how li{background:var(--blank);border-radius:16px;padding:12px 16px}
.hard{padding-left:20px}.hard li{margin:4px 0;font-weight:600}
.tip{background:var(--sun-bg);border-radius:14px;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--blank);border-radius:16px;padding:14px;text-align:center}
.stats strong{display:block;font-size:30px}
.stats span{font-size:13px;color:var(--muted)}
.neuron{display:flex;gap:6px;height:16px;align-items:center}
.neuron span{width:12px;height:12px;border-radius:50%;background:var(--violet);animation:pulse 1.8s infinite}
.neuron span:nth-child(2){background:var(--violet-2);animation-delay:.2s}.neuron span:nth-child(3){background:var(--sun);animation-delay:.4s}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1);opacity:1}}

main{min-height:calc(100vh - 64px);min-height:calc(100dvh - 64px)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:720px;margin:2vh auto 0;padding:30px 20px 24px;border-radius:32px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--card) 92%,var(--violet)) 0%,var(--card) 45%,color-mix(in srgb,var(--card) 90%,var(--sun)) 100%);
  border:1px solid var(--line);box-shadow:var(--shadow);animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@media (min-width:640px){.hero{padding:34px 44px 26px;margin-top:3vh}}
.halo{position:relative;width:128px;height:128px;display:grid;place-items:center;margin-bottom:6px}
.halo::before{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--violet-2) 38%,transparent) 0%,transparent 68%);animation:glow 3.2s ease-in-out infinite}
.halo::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed color-mix(in srgb,var(--violet) 30%,transparent);animation:spin 26s linear infinite}
.halo .logo.big{width:96px;height:96px;margin:0;position:relative}
.halo.small{width:96px;height:96px}.halo.small .logo.big{width:72px;height:72px}
@keyframes glow{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.06);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{margin:0;color:var(--violet);font-weight:700;font-size:15px;letter-spacing:.01em}
.hero h1{font-size:clamp(34px,8vw,48px);line-height:1.05;letter-spacing:-.025em;margin:6px 0 10px}
.hero .lead{font-size:18px;color:var(--muted);margin:0 0 18px;max-width:34em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px}
.chips span{font-size:14px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--blank);color:var(--ink);border:1px solid var(--line)}
.steps{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:12px;width:100%;counter-reset:st}
@media (min-width:640px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{counter-increment:st;position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.steps li::before{content:counter(st);position:absolute;top:10px;left:12px;font-size:13px;font-weight:800;color:var(--muted)}
.steps .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--violet),var(--violet-2))}
.steps li:nth-child(2) .ic{background:linear-gradient(135deg,#F5A400,var(--sun));color:#3A2A00}
.steps li:nth-child(3) .ic{background:linear-gradient(135deg,var(--mint),#3BC9A0)}
.steps .ic svg{width:24px;height:24px}
.steps b{font-size:17px}.steps span:last-child{font-size:14.5px;color:var(--muted);line-height:1.4}
button.primary.big{font-size:20px;padding:16px 46px;min-height:58px;border-radius:18px}
.hero .kbd{text-align:center}
.hero .hard{text-align:left}.hero .tip{text-align:left}
.review{width:100%;text-align:left;display:grid;gap:14px;margin:8px 0 6px}
.rev{border-radius:18px;padding:14px 16px;border:1px solid var(--line);background:var(--card)}
.rev h2{font-size:18px;margin:0 0 8px}
.rev ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rev li b{display:block}.rev li span{display:block;font-size:15px;color:var(--muted)}
.rev.first{border-color:color-mix(in srgb,var(--coral) 45%,transparent);background:var(--coral-bg)}
.rev.also{border-color:color-mix(in srgb,var(--sun) 55%,transparent);background:var(--sun-bg)}
.rev .badge{display:inline-block!important;font-size:12.5px!important;font-weight:700;color:var(--mint)!important;background:var(--mint-bg);border-radius:99px;padding:1px 8px;margin-top:2px}
.rev .more{margin:8px 0 0;font-size:14px;color:var(--muted)}
.rev .words{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0}
.end .lead{margin-top:4px}
.diag{font-weight:600}
.note.reg{background:var(--sun-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--sun) 55%,transparent)}
.back{margin-top:8px!important;font-weight:700;color:var(--mint)}
@media (prefers-reduced-motion:reduce){.halo::before,.halo::after{animation:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* NeuroTutor · banco de ítems (Lektionen 1–3, DaF kompakt neu A1)
   Campos: id, l (Lektion), c (contenido), s (estructura), x (contexto léxico), t (tipo de tarea),
   k (constructo), q (consigna), p (estímulo; {n} = hueco), m (b = huecos, s = oración, t = fichas),
   a (respuestas: por hueco en m=b; lista de oraciones válidas en m=s/t), crit (palabras del constructo
   que no admiten tolerancia ortográfica en m=s), tiles, v (estímulo visual), h1, h2, e (explicación),
   lex (huecos léxicos: erratas = ortografía), er (E/R), pair, d (dificultad 1–3), g (grupos de estructura: no pueden aparecer entre E y R). */
var ITEMS = [
/* ============================ LEKTION 1 ============================ */
{id:"L1-01",l:1,er:"E",pair:"p01",d:2,g:["aus-land"],c:"Origen con países con artículo",s:"aus der + país femenino",x:"países",t:"completar (2 huecos)",k:"preposición de origen + artículo",
 q:"Completa con la preposición y el artículo que corresponden a este país.",p:"Anna kommt {0} {1} Schweiz.",m:"b",a:[["aus"],["der"]],
 h1:"Para decir de dónde viene alguien se usa una preposición concreta. Además, Schweiz es uno de los pocos países que llevan artículo.",
 h2:"La preposición es aus. Schweiz es femenino, pero después de aus el artículo no es die: es otra palabra de tres letras que empieza por d-.",
 e:"Origen: aus + país. Los países femeninos (die Schweiz, die Türkei) se usan con aus der."},
{id:"L1-02",l:1,er:"R",pair:"p01",d:2,g:["aus-land"],c:"Origen con países con artículo",s:"aus der + país femenino",x:"países",t:"completar (2 huecos)",k:"preposición de origen + artículo",
 q:"Completa con la preposición y el artículo que corresponden a este país.",p:"Mehmet kommt {0} {1} Türkei.",m:"b",a:[["aus"],["der"]],
 h1:"Para decir de dónde viene alguien se usa una preposición concreta. Türkei es uno de los países que llevan artículo.",
 h2:"La preposición es aus. Türkei es femenino; después de aus el artículo no es die, sino otra palabra de tres letras que empieza por d-.",
 e:"Origen: aus + país. Con países femeninos: aus der Türkei, aus der Schweiz."},
{id:"L1-03",strict:1,l:1,er:"E",pair:"p02",d:1,g:["sein-praes"],c:"Verbo sein",s:"sein: ihr seid",x:"curso de idiomas",t:"completar",k:"conjugación de sein (ihr)",
 q:"Completa con la forma correcta del verbo sein en presente.",p:"Ihr {0} neu im Sprachkurs, oder?",m:"b",a:[["seid"]],
 h1:"Sein es irregular. Busca la forma para ihr: no se parece a la de wir ni a la de sie.",
 h2:"La forma para ihr tiene cuatro letras: empieza por sei- y termina en -d.",
 e:"Paradigma de sein: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind. Ojo: seid (verbo) no es seit."},
{id:"L1-04",strict:1,l:1,er:"R",pair:"p02",d:1,g:["sein-praes"],c:"Verbo sein",s:"sein: ihr seid",x:"estudios",t:"completar",k:"conjugación de sein (ihr)",
 q:"Completa con la forma correcta del verbo sein en presente.",p:"Tarik und Leyla, {0} ihr Studenten?",m:"b",a:[["seid"]],
 h1:"Sein es irregular. Fíjate en el sujeto de la pregunta (ihr) y busca su forma, distinta de la de wir.",
 h2:"La forma para ihr tiene cuatro letras: empieza por sei- y termina en -d.",
 e:"ihr seid. Paradigma: ich bin, du bist, er ist, wir sind, ihr seid, sie/Sie sind."},
{id:"L1-05",strict:1,l:1,er:"E",pair:"p03",d:2,g:["stamm-t"],c:"Verbos con raíz en -t",s:"arbeiten: -e- de unión",x:"trabajo",t:"completar",k:"conjugación de arbeiten (du)",
 q:"Completa con la forma correcta del verbo arbeiten.",p:"Du {0} schon, oder?",m:"b",a:[["arbeitest"]],
 h1:"La raíz de arbeiten termina en -t. Con du y con er/sie/es, estos verbos necesitan algo más antes de la terminación.",
 h2:"Entre la raíz arbeit- y la terminación de du (-st) hay que añadir una vocal: -e-.",
 e:"Si la raíz termina en -t o -d, se añade -e- con du, er/sie/es e ihr: du arbeitest, er arbeitet, ihr arbeitet."},

{id:"L1-17",dg:[["ihnen","Has usado la forma formal (Ihnen). Aquí se pide la informal."],["^(?!.*\\b(dir)\\b)","Falta devolver la pregunta: Und …?"]],l:1,d:1,g:["formal"],c:"Reaccionar a un saludo",s:"Responder a Wie geht's? y devolver la pregunta",x:"saludos",t:"producción escrita",k:"respuesta informal + devolver la pregunta",
 q:"Alguien te pregunta «Wie geht's?». Responde que estás bien o muy bien, da las gracias y devuelve la pregunta (informal).",m:"s",
 a:(function () { // todas las combinaciones razonables: estado × agradecimiento × pregunta devuelta
   var st = ["sehr gut", "gut", "mir geht es gut", "mir geht es sehr gut", "mir geht's gut", "mir geht's sehr gut", "es geht mir gut", "es geht mir sehr gut"],
       back = ["Und dir?", "Und wie geht es dir?", "Und wie geht's dir?", "Wie geht es dir?", "Wie geht's dir?"], out = [];
   var cap = function (x) { return x.charAt(0).toUpperCase() + x.slice(1); };
   out.push("Sehr gut, danke. Und dir?");
   st.forEach(function (e) { back.forEach(function (b) {
     out.push(cap(e) + ", danke. " + b); out.push("Danke, " + e + ". " + b); out.push("Danke, " + e + ", " + b.toLowerCase());
     out.push(cap(e) + ", vielen Dank. " + b); out.push("Danke schön, " + e + ". " + b);
   }); });
   return out.filter(function (x, k) { return out.indexOf(x) === k; });
 })(),crit:["dir"],
 h1:"La respuesta tiene tres partes: cómo estás, el agradecimiento y la pregunta devuelta en forma informal.",
 h2:"Bien = gut (muy bien = sehr gut); gracias = danke. Para devolver la pregunta: «Und …?» con el pronombre de du en esta fórmula (empieza por d-).",
 e:"También es correcto: Mir geht's gut, danke. Und dir? · Formal: Und Ihnen?"},

      var more = list.length > 8 ? '<p class="more">y ' + (list.length - 8) + ' más</p>' : "";
      return '<div class="rev ' + cls + '"><h2>' + title + '</h2><ul>' + list.slice(0, 8).map(function (o) {
        return '<li><b>' + esc(o.c) + '</b>' + (o.rec ? ' <span class="badge">luego la recuperaste sin ayuda</span>' : '') + '<span>' + esc(o.e) + '</span></li>';
      }).join("") + '</ul>' + more + '</div>';
    }
    app.innerHTML = "";
    var c = h("section", { class: "hero end" });
    c.innerHTML = '<div class="halo small">' + LOGO_BIG + '</div><h1>Has terminado.</h1>' +
      '<div class="stats"><div><strong>' + c1 + '</strong><span>de ' + N + ' al primer intento</span></div><div><strong>' + c2 + '</strong><span>con pistas, por ti mismo/a</span></div><div><strong>' + c3 + '</strong><span>con la solución</span></div></div>' +
      (adIds.length ? '<p class="lead">De las ' + adIds.length + ' estructuras que volvieron a aparecer tras un error, recuperaste ' + adOk + ' sin ninguna ayuda.</p>' : '') +
      '<div class="review">' + block("Repasa primero", hs.first, "first") + block("Repasa también", hs.also, "also") +
      (ow.length ? '<div class="rev ortho"><h2>Cuida la ortografía</h2><p class="words">' + ow.slice(0, 14).map(function (o) { return '<span lang="de"><s>' + esc(o[0]) + '</s> → <b>' + esc(o[1]) + '</b></span>'; }).join("") + '</p></div>' : '') +
      (!hs.first.length && !hs.also.length && !ow.length ? '<p>No hay nada pendiente: lo has resuelto todo a la primera.</p>' : '') + '</div>' +
      '<p class="kbd">Ya puedes cerrar esta ventana.</p>';
    app.appendChild(c);
    primaryAction = null;
  }

  /* ---------------- Actividad ---------------- */
  function renderItem(id) {
    var it = BY[id]; curItem = it;
    if (!st.cur || st.cur.id !== id) st.cur = { id: id, a: 0, h: 0, f: null, fc: null, cond: null, o: 0, t: Math.floor(Date.now() / 1000), dg: null };
    save(); progress();
    app.innerHTML = "";
    var card = h("section", { class: "card item", "aria-live": "polite" });
    card.appendChild(h("p", { class: "consigna" }, esc(it.q)));
    if (it.v) card.appendChild(h("div", { class: "visual" }, VIS[it.v.type](it.v)));
    var answerZone;
    if (it.m === "b") {
      var html = esc(it.p).replace(/\{(\d+)\}/g, function (_, n) {
        return '<input class="blank" data-b="' + n + '" aria-label="Hueco ' + (+n + 1) + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">';
      });
      answerZone = h("div", { class: "stim", lang: "de" }, html);
      card.appendChild(answerZone);
      [].forEach.call(answerZone.querySelectorAll(".blank"), function (inp) {
        inp.addEventListener("input", function () { inp.style.width = Math.max(7, inp.value.length + 2) + "ch"; inp.classList.remove("ok", "bad"); });
      });
    } else if (it.m === "s") {
      if (it.p) card.appendChild(h("div", { class: "stim src", lang: "de" }, esc(it.p)));
      answerZone = h("div", { class: "line" }, '<input class="answer" lang="de" aria-label="Tu respuesta" placeholder="Tu respuesta en alemán" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">');
      card.appendChild(answerZone);
    } else {
      var tiles = shuffled(it.tiles, it.id, it.a);
      answerZone = h("div", { class: "tiles" });
      answerZone.innerHTML = '<div class="build" lang="de" aria-label="Tu oración"></div><div class="pool" lang="de"></div>';
      card.appendChild(answerZone);
      var pool = answerZone.querySelector(".pool"), build = answerZone.querySelector(".build");
      tiles.forEach(function (w) {
        var b = h("button", { class: "tile", type: "button" }, esc(w));
        b.addEventListener("click", function () {
          if (stage !== "answering") return;
          (b.parentNode === pool ? build : pool).appendChild(b);
          build.classList.toggle("has", build.children.length > 0);
        });
        pool.appendChild(b);
      });
    }
    card.appendChild(h("div", { class: "feedback", id: "fb" }));
    var actions = h("div", { class: "actions" });
    var btn = h("button", { class: "primary", id: "check", type: "button" }, "Comprobar");
    actions.appendChild(btn); card.appendChild(actions);
    card.appendChild(h("p", { class: "kbd" }, "<kbd>Enter</kbd> para comprobar"));
    app.appendChild(card);
    btn.addEventListener("click", function () { if (stage === "answering") check(); else if (stage === "done") next(); });
    primaryAction = function () { if (stage === "answering") check(); else if (stage === "done") next(); };
    stage = "answering"; tShown = Date.now();
    if (st.cur.h > 0 && st.cur.a > 0) showHint(it, st.cur.h, true);
    focusFirst();
  }
  function focusFirst() {
    var f = app.querySelector(".blank, .answer, .tile");
    if (f && window.matchMedia("(pointer: fine)").matches) f.focus();
  }
  function collect(it) {
    if (it.m === "b") return [].map.call(app.querySelectorAll(".blank"), function (x) { return x.value; });
    if (it.m === "s") return app.querySelector(".answer").value;
    return [].map.call(app.querySelectorAll(".build .tile"), function (x) { return x.textContent; }).join(" ");
  }
  function respText(it, resp) { return it.m === "b" ? resp.join(" / ") : resp; }

  function check() {
    var it = curItem, resp = collect(it), g = E.grade(it, resp);
    if (g.empty) { flash("Escribe primero tu respuesta: el intento es parte del aprendizaje."); return; }
    var cur = st.cur, latency = Date.now() - tShown;
    // Hora correcta en el registro equivocado: se avisa y no cuenta como intento
    if (!g.ok && g.reg) {
      var cond0 = cur.cond || (it.er === "E" ? "PEND" : it.er === "R" ? "R" + (st.pc[it.pair] || "NA") : it.er === "A" ? "ADA" : "STD");
      logInteraction(iid(it, cond0, "reg" + (cur.a + 1)), "fill-in", respText(it, resp), "neutral", latency, E.solutionText(it));
      flash(it.clk === "inf" ? "Esa hora es correcta, pero en lenguaje oficial. Aquí se pide cómo se dice en una conversación. Vuelve a intentarlo."
                             : "Esa hora es correcta, pero en lenguaje coloquial. Aquí se pide la hora oficial (formato de 24 horas). Vuelve a intentarlo.", "reg");
      tShown = Date.now(); return;
    }
    cur.a++;
    var first = cur.a === 1;
    if (first) { cur.f = clean(respText(it, resp), 60).replace(/\|/g, "/"); cur.fc = g.ok ? 1 : 0; cur.lat = latency; }
    if (first && it.er === "E") {
      if (g.ok) cur.cond = "NA";
      else {
        var fd = st.c[0], fg = st.c[1];
        cur.cond = fd < fg ? "FD" : fg < fd ? "FGG" : (Math.random() < 0.5 ? "FD" : "FGG");
        st.c[cur.cond === "FD" ? 0 : 1]++;
      }
      st.pc[it.pair] = cur.cond;
    }
    if (!cur.cond) cur.cond = it.er === "R" ? "R" + (st.pc[it.pair] || "NA") : it.er === "A" ? "ADA" : "STD";
    logInteraction(iid(it, cur.cond, "a" + cur.a + "h" + cur.h), it.m === "t" ? "sequencing" : "fill-in", respText(it, resp), g.ok ? "correct" : "wrong", latency, E.solutionText(it));
    if (it.m === "b" && g.per) markBlanks(g.per);
    if (g.diag) cur.dg = g.diag;
    if (g.ok) { if (g.ortho && g.ortho.length) cur.o = 1; return finish(it, cur.a === 1 ? (cur.o ? "5" : "1") : "2", g); }
    if (cur.cond === "FD") return finish(it, "4", g);
    if (cur.a >= 3) return finish(it, "3", g);
    cur.h = cur.a; save();
    showHint(it, cur.h, false, g.diag);
    tShown = Date.now();
  }
  function markBlanks(per) {
    [].forEach.call(app.querySelectorAll(".blank"), function (x, i) { x.classList.remove("ok", "bad"); x.classList.add(per[i] ? "ok" : "bad"); });
  }
  function flash(msg, cls) { document.getElementById("fb").innerHTML = '<div class="note ' + (cls || "") + '">' + esc(msg) + '</div>'; }
  function showHint(it, level, restoring, diag) {
    var fb = document.getElementById("fb");
    var multi = it.m === "b" && it.a.length > 1 && !restoring ? '<p class="sub">Los huecos marcados en verde ya están bien.</p>' : "";
    var text = level === 1 ? it.h1 : it.h2;
    var body = diag ? '<p class="diag">' + esc(diag.msg) + '</p>' + (level > 1 ? '<p>' + esc(text) + '</p>' : '') : '<p>' + esc(text) + '</p>';
    fb.innerHTML = '<div class="hint lvl' + level + '"><div class="bulbs" aria-hidden="true"><i class="on"></i><i class="' + (level > 1 ? "on" : "") + '"></i></div>' +
      '<div><p class="tag">Pista ' + level + ' de 2</p>' + body + multi + '</div></div>';
    var inp = app.querySelector(".blank.bad, .answer");
    if (inp && window.matchMedia("(pointer: fine)").matches) {
      inp.focus();
      if (inp.classList.contains("blank")) inp.select(); else { var L = inp.value.length; inp.setSelectionRange(L, L); }
    }
  }
  function orthoHtml(list) {
    return list.map(function (o) { return '<span lang="de"><s>' + esc(o.from) + '</s> → <b>' + esc(o.to) + '</b></span>'; }).join(", ");
  }
  function finish(it, code, g) {
    var cur = st.cur, fb = document.getElementById("fb"), sol = E.solutionText(it);
    var final = code === "1" || code === "2" || code === "5" ? 1 : 0, html;
    var cameBack = (it.er === "A" || (it.er === "R" && (st.pc[it.pair] === "FD" || st.pc[it.pair] === "FGG"))) && cur.a === 1 && final;
    var bonus = cameBack ? '<p class="back">Esta estructura te costó antes; ahora la has resuelto sin ayuda.</p>' : "";
    if (g.ortho && g.ortho.length) g.ortho.forEach(function (o) { if (st.ow.length < 20) st.ow.push([clean(o.from, 20), clean(o.to, 20)]); });
    if (code === "1" || code === "5") {
      if (g.ortho && g.ortho.length) {
        var what = it.ord ? "El orden de la oración es correcto." : it.clk ? "La hora es correcta." : it.m === "b" ? "Correcto." : "La estructura es correcta.";
        html = '<div class="good"><p class="tag">' + what + '</p><p>Revisa únicamente la ortografía: ' + orthoHtml(g.ortho) + '.</p>' + bonus + '</div>';
      } else html = '<div class="good"><p class="tag">Correcto.</p><p lang="de" class="de">' + esc(g.canon || sol) + '</p>' + bonus + '</div>';
    } else if (code === "2") {
      html = '<div class="good"><p class="tag">Correcto: lo has encontrado tú.</p><p lang="de" class="de">' + esc(g.canon || sol) + '</p>' +
        (g.ortho && g.ortho.length ? '<p>Ortografía: ' + orthoHtml(g.ortho) + '.</p>' : "") + '</div>';
    } else {
      var ex = cur.dg && cur.dg.ex ? cur.dg.ex : it.e;
      html = '<div class="solution"><p class="tag">La respuesta correcta es:</p><p lang="de" class="de">' + esc(sol) + '</p><p>' + esc(ex) + '</p></div>';
    }
    fb.innerHTML = html;
    [].forEach.call(app.querySelectorAll("input"), function (x) { x.readOnly = true; });
    var btn = document.getElementById("check"); btn.textContent = "Continuar"; btn.classList.add("next");
    app.querySelector(".kbd").innerHTML = "<kbd>Enter</kbd> para continuar";
    stage = "done";
    var now = Math.floor(Date.now() / 1000), dist = "", dsec = "", orig = "";
    if (it.er === "E") st.et[it.pair] = now;
    if (it.er === "R") {
      var ePos = null; ORDER.forEach(function (id, p) { if (BY[id].pair === it.pair && BY[id].er === "E") ePos = p; });
      dist = st.i - ePos; dsec = st.et[it.pair] ? now - st.et[it.pair] : "";
    }
    if (it.er === "A") {
      var qe = st.q.filter(function (x) { return x[0] === it.id; })[0];
      if (qe) { dist = st.step - qe[2]; dsec = now - qe[3]; }
      orig = it.base;
    }
    var summary = ["first=" + cur.f, "fc=" + cur.fc, "att=" + cur.a, "hint=" + cur.h, "self=" + (final && cur.a > 1 ? 1 : 0),
      "final=" + final, "tsc=" + (cur.fc ? 1 : 0), "ortho=" + cur.o, "lr=" + (it.er === "R" || it.er === "A" ? cur.fc : ""),
      "dist=" + dist, "dsec=" + dsec, "rt=" + Math.round((cur.lat || 0) / 100) / 10, "ts=" + new Date().toISOString()].join("|");
    logInteraction(iid(it, cur.cond, "SUM"), "performance", summary, final ? "correct" : "wrong", cur.lat || 0, "");
    if (it.er === "A") {
      st.ad[it.id] = code;
      st.q = st.q.filter(function (x) { return x[0] !== it.id; });
    } else {
      st.r = st.r.substr(0, st.i) + code + st.r.substr(st.i + 1);
      st.i++;
      // recuperación adaptativa: error real en la primera respuesta de un ítem fuera de los pares E→R
      if (!it.er && cur.fc === 0 && VARIANT_OF[it.id] && !st.ad[VARIANT_OF[it.id]]) {
        st.q.push([VARIANT_OF[it.id], st.step + 1 + 8 + Math.floor(Math.random() * 8), st.step + 1, now]);
      }
    }
    st.step++; st.cur = null;
    if (final) { var lg = document.querySelector(".top .logo"); if (lg) { lg.classList.remove("cheer"); void lg.getBoundingClientRect(); lg.classList.add("cheer"); } }
    if (API) {
      LMS.set("cmi.core.lesson_status", "incomplete");
      LMS.set("cmi.core.score.min", "0"); LMS.set("cmi.core.score.max", "100");
      LMS.set("cmi.core.score.raw", String(Math.round(100 * (st.r.match(/[15]/g) || []).length / N)));
    }
    save(); progress();
    btn.focus({ preventScroll: true });
  }

  /* ---------------- Teclado: una pulsación = una acción ---------------- */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault(); e.stopPropagation();
    if (e.repeat || e.isComposing) return;
    var now = Date.now(); if (now - lock < 350) return; lock = now;
    if (primaryAction) primaryAction();
  }, true);

  /* ---------------- Sesión ---------------- */
  var sessionStart = Date.now(), closed = false;
  function closeSession() {
    if (!API) return;
    var s = Math.floor((Date.now() - sessionStart) / 1000);
    LMS.set("cmi.core.session_time", pad2(Math.floor(s / 3600)) + ":" + pad2(Math.floor((s % 3600) / 60)) + ":" + pad2(s % 60));
    LMS.set("cmi.core.exit", currentId() ? "suspend" : "");
    save(); LMS.finish();
  }
  function onLeave() { if (!closed) { closed = true; closeSession(); } }
  window.addEventListener("pagehide", onLeave);
  window.addEventListener("beforeunload", onLeave);

  LMS.init();
  st = load();
  var resumed = !!st;
  if (!st) st = fresh();
  if (API) {
    var status = LMS.get("cmi.core.lesson_status");
    if (status === "not attempted" || !status) LMS.set("cmi.core.lesson_status", "incomplete");
    var cnt = parseInt(LMS.get("cmi.interactions._count"), 10); if (!isNaN(cnt) && cnt > st.ix) st.ix = cnt;
    LMS.commit();
  }
  if (!currentId()) endScreen(); else startScreen(resumed);
  window.__NT = { state: function () { return st; }, current: currentId };
})();

</script>
</body>
</html>
